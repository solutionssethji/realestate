name: customer_app
description: "Shubhaytanam Connect — Premium property discovery app powered by Firebase."
publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.1.0
  go_router: ^17.5.0
  intl: ">=0.20.2 <0.21.0"
  url_launcher: ^6.3.2
  hooks_riverpod: ^3.1.0
  flutter_hooks: ^0.21.3+1
  responsive_framework: ^1.5.1
  freezed_annotation: ^3.1.0
  riverpod_annotation: ^4.0.0
  json_annotation: ^4.9.0
  flutter_localizations:
    sdk: flutter
  firebase_core: ^4.13.0
  cloud_firestore: ^6.8.0
  firebase_auth: ^6.5.7
  firebase_storage: ^13.4.6
  firebase_messaging: ^16.5.0
  firebase_analytics: ^12.4.6
  cloud_functions: ^6.3.6
  google_fonts: ^8.2.1
  cached_network_image: ^3.4.1
  lucide_icons: ^0.257.0
  shimmer: ^3.0.0
  image_picker: ^1.2.3
  image_cropper: ^12.2.1
  pdf: ^3.12.0
  printing: ^5.14.3
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  carousel_slider: ^5.1.2
  file_picker: ^12.1.3
  share_plus: ^13.3.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.5.4
  freezed: ^3.2.3
  riverpod_generator: ^4.0.0+1
  json_serializable: ^6.9.5
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.0
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0

# The following section is specific to Flutter packages.
flutter:
  generate: true

  uses-material-design: true
  assets:
    - assets/
