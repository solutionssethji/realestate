name: customer_app
description: "Shubhaytanam Connect — Premium property discovery app powered by Firebase."
publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^17.5.0
  intl: ">=0.20.2 <0.21.0"
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  hooks_riverpod: ^2.5.1
  flutter_hooks: ^0.20.0
  responsive_framework: ^1.5.1
  freezed_annotation: ^2.4.4
  riverpod_annotation: ^2.3.5
  flutter_localizations:
    sdk: flutter
  google_maps_flutter: ^2.18.0
  firebase_core: ^4.13.0
  cloud_firestore: ^6.8.0
  firebase_auth: ^6.5.7
  firebase_storage: ^13.4.6
  firebase_messaging: ^16.5.0
  firebase_crashlytics: ^5.2.7
  firebase_analytics: ^12.4.6
  cloud_functions: ^6.3.6
  google_fonts: ^8.2.1
  cached_network_image: ^3.4.1
  lucide_icons: ^0.257.0
  shimmer: ^3.0.0
  razorpay_flutter: ^1.4.5
  image_picker: ^1.2.3
  image_cropper: ^12.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.2
  riverpod_generator: ^2.4.3
  json_serializable: ^6.9.5
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

# The following section is specific to Flutter packages.
flutter:
  generate: true

  uses-material-design: true
  assets:
    - assets/
